defaults:
  - _self_
  - task: g1_walk_height/mujoco
  - optional workflow: null
  - optional calibration_playback: null
  - optional recording_profile: null

algo:
  algo_log_name: distill
  seed: 1
  num_envs: 4096
  max_agent_steps: 100000000
  gradient_length: 15
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  loss_type: mse
  aux_loss_coef: 0.0
  role_loss_coef: 0.0
  role_expert_targets: {}
  command_intent_loss_coef: 0.0
  command_intent_expert_targets:
    active: 0
    inactive: 1
  expert_behavior_loss_source: auto
  save_interval_steps: 10000000
  log_interval_steps: 32768
  load_run: "-1"
  checkpoint: -1

teacher:
  algo_family: sac
  algo_type: sac
  algo_log_name: fast_sac
  task: sac/g1_walk_height/mujoco
  task_name: G1WalkHeight
  checkpoint_path: null
  load_run: "-1"
  checkpoint: -1
  obs_dim: 99
  action_dim: 29
  actor_hidden_dim: 512
  use_layer_norm: true
  obs_normalization: true

student:
  model_type: mlp
  obs_dim: 99
  action_dim: 29
  hidden_dims: [256, 256, 256]
  num_experts: 3
  expert_hidden_dims: [256, 256, 256]
  router_hidden_dims: []
  routing_mode: soft
  router_temperature: 1.0
  activation: elu
  squash_action: true

training:
  task_name: G1WalkHeight
  device: null
  logger: tensorboard
  sim_backend: mujoco
  play_only: false
  play_render_mode: none
  play_checkpoint_path: null
  play_env_num: 16
  play_steps: 200
  dry_run: false
  dry_run_batch_size: 8
  dry_run_updates: 1
  dry_run_checkpoint: null
  offline_dataset_path: null
  offline_batch_size: 256
  offline_max_updates: 1
  offline_init_checkpoint: null
  offline_resume_optimizer: true
  offline_checkpoint: null
  offline_repeat_dataset: false
  offline_shuffle: false
  offline_balance_key: none
  offline_balanced_labels: []
  offline_balance_quotas: {}
  offline_min_balanced_replay_passes: 0
  offline_min_balanced_replay_labels: []
  online_dagger: false
  fada:
    enabled: false
    obs_dim: 66
    observation_contract: g1_fada_state_v2
    execution_mode: persistent_async
    async_request_timeout_seconds: 3600.0
    async_artifact_dir: logs/fada/planner_idm_v011/source_batches
    paper_source_enabled: true
    oracle_shadow_enabled: true
    intermediate_oracle_checkpoint_paths: []
    intermediate_oracle_count: 20
    suboptimal_data_ratio: 2.0
    quality_eval_max_windows: 4096
    history_length: 30
    prediction_horizon: 6
    command_dim: 3
    hidden_dim: 128
    num_heads: 4
    planner_layers: 3
    idm_encoder_layers: 3
    idm_decoder_layers: 2
    feedforward_dim: 512
    dropout: 0.0
    iterations: 8
    windows_per_iteration: 65536
    num_envs: 64
    replay_capacity: 524288
    batch_size: 512
    idm_updates: 128
    planner_updates: 128
    idm_learning_rate: 3.0e-4
    planner_learning_rate: 3.0e-4
    max_grad_norm: 1.0
    observation_key: obs
    teacher_projection: identity
    student_projection: g1_fada_state_v2
    student_drop_index: null
    command_info_keys: [commands]
    max_env_steps: null
    checkpoint_path: logs/fada/planner_idm_v011.pt
    resume_path: null
    initial_weights_path: null
    stand_transition_curriculum:
      enabled: true
      standing_task: g1_stand_still/mujoco
      walk_ratio: 0.5
      static_stand_ratio: 0.25
      walk_to_stand_ratio: 0.25
      walk_command: [0.4, 0.0, 0.0]
      pre_switch_steps: 30
      post_switch_steps: 36
    v005_replay:
      enabled: true
      walk_cold_start_ratio: 0.2
      static_cold_start_ratio: 0.5
      planner_scenario_ratios:
        walk: 0.5
        static_stand: 0.25
        walk_to_stand: 0.25
      walk_steady_speed_thresholds: [0.25, 0.6]
      walk_steady_speed_ratios:
        slow: 0.1
        medium: 0.3
        high: 0.6
      min_high_speed_replay_passes: 8
    v005_collection_profile:
      walk_cold_start_ratio: 0.5
      static_cold_start_ratio: 0.5
  workflow:
    enabled: false
    mode: auto
    execution_mode: legacy
    run_dir: null
    parent_run_dir: null
    artifact_dir: logs/distill_role_artifacts
    schema_version: 1
    adopt_legacy_artifacts: false
    roles: []
    scenarios: []
    collect_num_samples: 262144
    collect_num_envs: 64
    bootstrap_batch_size: 512
    bootstrap_updates: 20000
    dagger_iterations: 8
    dagger_samples_per_role: 65536
    dagger_batch_size: 512
    dagger_updates_per_iteration: 128
    dagger_balance_key: role
    dagger_balanced_labels: []
    transition_pre_switch_steps: 8
    transition_nominal_settle_steps: 0
    transition_min_post_switch_steps: 20
    dagger_min_transition_replay_passes: 8
    dagger_min_transition_replay_labels: [walk_to_stop]
    transition_walk_command: [0.4, 0.0, 0.0]
    transition_walk_commands: []
    transition_walk_target_height: null
    transition_post_switch_target_heights: []
    transition_max_env_steps: null
  dagger_iterations: 8
  dagger_samples_per_iteration: 65536
  dagger_batch_size: 512
  dagger_updates_per_iteration: 128
  dagger_role_label: null
  dagger_checkpoint: null
  dagger_shuffle: true
  dagger_balance_key: none
  dagger_balanced_labels: []
  formal_run: false
  formal_run_name: null
  formal_run_dir: null
  multitask_dataset_path: null
  multitask_sources: []
  multitask_expected_student_obs_dim: null
  multitask_expected_teacher_obs_dim: null
  multitask_expected_teacher_action_dim: null
  collect_dataset_path: null
  collect_num_samples: 1024
  collect_num_envs: 1
  collect_action_mode: zero
  collect_action_seed: null
  collect_rollout_checkpoint_path: null
  collect_teacher_obs_key: obs
  collect_teacher_projection: identity
  collect_student_projection: identity
  collect_student_drop_index: null
  collect_command_sample_filter: none
  collect_command_info_key: commands
  collect_target_height_info_key: null
  collect_command_xy_threshold: 0.05
  collect_command_yaw_threshold: 0.05
  collect_max_env_steps: null
  collect_role_label: null
  log_root: null
  log_dir: null

interactive:
  action_mode: zero
  policy_obs_mode: auto
  show_target_bodies: false
  show_reward_debug: false
  target_show_axes: false
  target_body_names: ""
  target_max_bodies: 0
  target_marker_radius: 0.02
  target_axis_length: 0.08
  target_marker_alpha: 0.75
  reward_debug_show_velocity: false
  reward_debug_lin_vel_scale: 0.08
  reward_debug_ang_vel_scale: 0.05
  reward_debug_show_connectors: false
  reward_debug_show_global_anchor: false
  camera_follow_body: true
  camera_focus_body_name: ""
  camera_height_offset: 0.15
  camera_distance: null
  camera_elevation: null
  camera_azimuth: null
  use_env_visual_model: true
  speed: 1.0
  start_paused: false
  keyboard: false
  keyboard_step_lin: 0.1
  keyboard_step_ang: 0.2
  require_keyboard_command_obs: true
  distill_command_routing: auto
  distill_command_xy_threshold: 0.05
  distill_command_yaw_threshold: 0.05
  distill_command_routing_bias: 10.0

env: {}
reward: {}

online_adaptation:
  enabled: false
  lambda_forget: 0.99
  update_interval: 10
  learning_rate: 1.0e-4
  max_grad_norm: 1.0
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05

video_recording:
  enabled: true
  output_path: logs/fada_online/online_adaptation.mp4
  duration_s: 30.0
  fps: 30
  width: 1280
  height: 720
  progress_interval_s: 1.0  # Wall-clock seconds; report after completed control steps.
  show_status_overlay: true

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
