# Explicit offline diagnostic. No capture or training runs on import.
mode: capture  # capture | compare
output_path: data/sttt/physical_probes.pt
input_path: data/sttt/physical_probes.pt
source:
  checkpoint_path: null  # Existing G1 FADA Planner-IDM checkpoint, never a zero-policy fallback.
  seed: 0
  device: null
  overrides: [recording_profile=straight_payload, env.runtime_payload.enabled=false]
probe:
  num_samples: 4  # Finite attempted origins, not retry-until-success.
  warmup_steps: 30
  stride_steps: 30
  history_length: 15
  horizon: 15
  action_steps: [0]
  joint_indices: [0, 1, 2]
  epsilon: 0.01  # env_input units; transformed/clipped actions are unusable cases.
  replay_position_tolerance_m: 0.0001
  replay_yaw_tolerance_rad: 0.0001
evaluation:
  checkpoint: null  # Trained spatial world-model checkpoint for compare.
  gradient_zero_tolerance: 0.00000001
