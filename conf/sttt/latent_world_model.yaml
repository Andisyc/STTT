data:
  train_dirs: []
  validation_dirs: []
model:
  obs_dim: null  # Resolved from the captured observation contract.
  action_dim: 29
  embed_dim: 128
  hidden_dim: 128
  belief_dim: 128
  stoch_groups: 8
  stoch_classes: 8
  recurrent_model: block_gru
  num_blocks: 4
  dynamics_layers: 1
  prior_layers: 2
  posterior_layers: 1
  encoder_layers: 2
  decoder_layers: 2
  head_layers: 2
  norm_eps: 0.0001
  unimix: 0.01
  action_scale: null
  ctrl_dt: null  # Resolved from the physical capture contract.
training:
  max_updates: 200000
  batch_size: 16
  microbatch_size: null  # None means one full effective batch.
  rollout_windows: 2
  cache_size: 2
  validation_every: 1000
  validation_batches: 16
  checkpoint_every: 1000
  learning_rate: 0.0003
  motion_learning_rate: 0.00003
  warmup_updates: 1000
  weight_decay: 0.000001
  gradient_clip_norm: 10.0
  motion_gradient_clip_norm: 1.0
  resume_checkpoint: null
  initial_checkpoint: null  # Warm start on newly collected data, with a fresh optimizer.
  loss:
    free_nats: 1.0
    kl_scale: 1.0
    kl_balance: 0.8
    reconstruction_scale: 1.0
    motion_scale: 1.0
    risk_scale: 1.0
    overshoot_scale: 1.0
    prior_reconstruction_scale: 1.0
    window_scale: 1.0
    motion_velocity_tolerance: 0.05
    motion_yaw_rate_tolerance: 0.1
    window_xy_tolerance: 0.01
    window_yaw_tolerance: 0.02
device: cpu
seed: 0
output_dir: null
