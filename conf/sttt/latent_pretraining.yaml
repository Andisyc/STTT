defaults:
  - latent_world_model@wm
  - latent_reference_evaluation@evaluation
  - _self_

output_dir: null
policy_checkpoint: null
profile_path: null  # Omit only for a legacy checkpoint with an embedded source profile.
device: cpu
seed: 0
source_overrides: []  # Physical settings; measurement noise remains disabled.
resume_checkpoint: null  # Paired joint state; collectors resume in new physical episodes.
stage: all  # all: base PPO + FiLM PPO; base / film run one stage.
schedule:
  pretrain_wm_updates: 10000  # Shortened training budget; convergence is measured separately.
  base_iterations: 3000
  film_iterations: 1000
  wm_updates_per_iteration: 8
  checkpoint_every: 2500
replay:
  capacity_transitions: 1000000
capture:
  initial: true  # Set false only with wm.data.train_dirs / validation_dirs.
  num_envs: 64
  initial_min_transitions: 1000000
  validation_episodes: 10
  steps_per_iteration: 20  # PWM H=16 rounded up to two project residual windows.
  max_episode_steps: 1000
  window_steps: 10
  residual_amplitude_rad: null  # Explicit physical-radian exploration bound.
  random_residual_probability: 0.1  # Initial WM capture only; PPO executes its own samples.
  risk_tilt_limit_rad: null
  command_resampling_s: 10.0
  command_ranges: null  # [vx, vy, yaw_rate] lower/upper pairs; otherwise use source-profile ranges.
  conditions:
    - name: nominal
      source_overrides: []
wm:
  device: ${device}
  seed: ${seed}
  training:
    max_updates: ${schedule.pretrain_wm_updates}
    batch_size: 256
    microbatch_size: 32
    rollout_windows: 2
    learning_rate: 0.0003
actor:
  initial_actor_checkpoint: null
  training:
    residual_limit_rad: null  # 29 explicit source-order physical-radian limits.
    hidden_dims: [256, 128]
    max_updates: ${schedule.base_iterations}
    batch_size: 64
    horizon_windows: 2
    learning_rate: 0.0005
    max_grad_norm: 1.0
    checkpoint_every: ${schedule.checkpoint_every}
    seed: ${seed}
  trajectories:
    base:
      preview_points: 8
      preview_spacing_m: 0.15
      projection_window_m: 0.5
    lateral_range: [-0.3, 0.3]
    heading_range: [-0.3, 0.3]
ppo:
  rollout_windows: 16
  num_learning_epochs: 5
  num_mini_batches: 4
  clip_param: 0.2
  gamma: 0.99
  lam: 0.95
  value_loss_coef: 1.0
  entropy_coef: 0.01
  learning_rate: ${actor.training.learning_rate}
  max_grad_norm: ${actor.training.max_grad_norm}
  desired_kl: 0.01
context_adaptation:
  dimension: 16
  learning_rate: 0.001
  updates_per_window: 1
  horizon_windows: ${actor.training.horizon_windows}
  max_grad_norm: ${actor.training.max_grad_norm}
rewards:
  joint_position_weight: 0.75
  joint_velocity_weight: 0.5
  velocity_weight: 1.0
  yaw_rate_weight: 0.5
  posture_weight: 1.0
  path_weight: 1.0
  action_rate_weight: 0.01
  termination_cost: 200.0
  joint_position_tolerance_rad: 0.25
  joint_velocity_tolerance_rad_s: 2.0
  velocity_tolerance_m_s: 0.5
  yaw_rate_tolerance_rad_s: 1.0
  lateral_tolerance_m: 0.3
  tilt_tolerance_rad: 0.5
evaluation:
  horizon_windows: ${actor.training.horizon_windows}

