online:
  calibration_windows: 2
  horizon_windows: 2
  replay_capacity_windows: 32
  replay_sequence_windows: 2
  wm_updates_per_cycle: 1
  planner_updates_per_cycle: 1
  wm_learning_rate: 0.0001
  planner_learning_rate: 0.0001
  lora_rank: 8
  lora_alpha: 16.0
  max_grad_norm: 1.0
  # Fixed at adaptation start and persisted on resume; penalizes cumulative LoRA drift.
  parameter_change_scale: 0.001
  position_tolerance_m: 0.3
  heading_tolerance_rad: 0.3
  motion_xy_tolerance_m: 0.01
  motion_yaw_tolerance_rad: 0.02
  adapt_world_model: true
  adapt_planner: true
  trajectory:
    kind: straight
    length_m: 30.0
    radius_m: 2.0
    speed_m_s: 0.4
    samples: 1024
    preview_points: 8
    preview_spacing_m: 0.15
    projection_window_m: 0.5
    initial_lateral_m: 0.0
    initial_heading_rad: 0.0
