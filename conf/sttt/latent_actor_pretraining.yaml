world_model_checkpoint: null
policy_checkpoint: null
data_dirs: []
output_dir: null
device: cpu
resume_checkpoint: null
initial_actor_checkpoint: null
training:
  residual_limit_rad: null  # 29 source-order physical-radian bounds; set from the controller.
  hidden_dims: [256, 128]
  max_updates: 10000
  batch_size: 16
  microbatch_size: null
  horizon_windows: 2
  learning_rate: 0.0001
  max_grad_norm: 10.0
  checkpoint_every: 1000
  seed: 0
  critic:
    hidden_dims: [256, 128]
    learning_rate: 0.0005
    epochs: 8
    minibatches: 4
    lambda_return: 0.95
    target_tau: 0.01
    max_grad_norm: 10.0
trajectories:
  base:
    length_m: 30.0
    samples: 1024
    preview_points: 8
    preview_spacing_m: 0.15
    projection_window_m: 0.5
  kinds: [straight, circle, figure_eight, random]
  speed_range: [0.2, 0.8]
  radius_range: [1.0, 4.0]
  lateral_range: [-0.3, 0.3]
  heading_range: [-0.3, 0.3]
costs:
  lateral_weight: 0.5
  lateral_velocity_weight: 1.0
  forward_weight: 1.0
  smoothness_weight: 0.01
  risk_weight: 1.0
  lateral_tolerance_m: 0.3
  lateral_velocity_tolerance_m_s: 1.0
  forward_speed_floor_m_s: 0.1
  discount: 0.99
  failure_cost_rate: 4.0
